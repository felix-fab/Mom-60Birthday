<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#000000" />
<title>Happy Birthday 🎂</title>
<style>
  * { box-sizing: border-box; margin:0; padding:0; }
  html, body { height:100%; overflow:hidden; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background:#05030f; color:#fff;
         display:flex; align-items:center; justify-content:center; }
  #screen { position:relative; width:100%; height:100%; display:flex; flex-direction:column;
            align-items:center; justify-content:center; overflow:hidden;
            background:radial-gradient(circle at 50% 20%, #1c1140, #05030f 70%); }
  /* langsam wechselnde Hintergrund-Farben */
  #screen.bg-anim { animation:bgShift 9s ease-in-out infinite; }
  @keyframes bgShift {
    0%,100% { background:radial-gradient(circle at 50% 20%, #1c1140, #05030f 70%); }
    50%     { background:radial-gradient(circle at 50% 30%, #3a1550, #0a0416 70%); }
  }

  /* ---------- Anmelden ---------- */
  #login { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
           justify-content:center; gap:18px; padding:24px; text-align:center; z-index:20; }
  #login h1 { font-size:1.5rem; font-weight:700; }
  #login p { opacity:.75; font-size:.95rem; max-width:300px; }
  #login input { font-size:1.2rem; padding:14px 18px; border-radius:12px; border:2px solid rgba(255,255,255,.3);
                 background:rgba(255,255,255,.08); color:#fff; text-align:center; width:80%; max-width:280px; }
  #login button { font-size:1.1rem; font-weight:700; padding:14px 34px; border:none; border-radius:12px;
                  background:linear-gradient(135deg,#ff6b6b,#f06595); color:#fff; cursor:pointer;
                  box-shadow:0 8px 24px rgba(240,101,149,.4); }
  #login button:active { transform:scale(.96); }
  .ready-tag { font-size:.85rem; opacity:.8; margin-top:8px; min-height:1.2em; }

  /* ---------- Warten ---------- */
  #wait { position:absolute; inset:0; display:none; flex-direction:column; align-items:center;
          justify-content:center; gap:22px; z-index:10; text-align:center; padding:20px; }
  .ringwrap { position:relative; width:110px; height:110px; }
  .ringwrap .ring { position:absolute; inset:0; border-radius:50%; }
  .ringwrap .ring.bg { border:4px solid rgba(255,255,255,.12); }
  .ringwrap .ring.spin { border:4px solid transparent; border-top-color:#ffd166; border-right-color:#f06595;
                         animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .ringwrap .heart { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
                     font-size:2.2rem; animation:beat 1.2s ease-in-out infinite; }
  @keyframes beat { 0%,100%{transform:scale(1);} 30%{transform:scale(1.18);} }
  #wait .name { font-size:1.25rem; font-weight:700; text-shadow:0 2px 20px rgba(255,209,102,.3); }
  #wait .pos { font-size:.9rem; opacity:.85; }
  #wait.fade-out { opacity:0; transition:opacity .45s ease; }

  /* ---------- Countdown ---------- */
  #countdown { position:absolute; inset:0; display:none; align-items:center; justify-content:center;
               z-index:10; }
  #countdown .cdwrap { position:relative; display:flex; align-items:center; justify-content:center;
                       width:min(70vw,320px); height:min(70vw,320px); }
  #countdown .cdring { position:absolute; inset:0; border-radius:50%;
                       background:conic-gradient(#ff6b6b, #f06595, #ffd166, #ff6b6b);
                       filter:blur(2px); opacity:.9; }
  #countdown .cdinner { position:absolute; inset:8px; border-radius:50%;
                        background:radial-gradient(circle at 50% 35%, #2a1a4a, #05030f);
                        display:flex; align-items:center; justify-content:center; }
  #countdown .num { font-size:min(34vw, 180px); font-weight:900; line-height:1;
                    background:linear-gradient(180deg,#fff,#ffd166);
                    -webkit-background-clip:text; background-clip:text; color:transparent;
                    filter:drop-shadow(0 0 24px rgba(255,209,102,.55)); }
  .pop { animation:pop .9s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop { 0%{transform:scale(2.4) rotate(-6deg); opacity:0;}
                   35%{transform:scale(.9) rotate(2deg); opacity:1;}
                   100%{transform:scale(1) rotate(0);} }

  /* ---------- Blitz ---------- */
  #flash { position:absolute; inset:0; display:none; z-index:5; }

  /* ---------- Effekte / Welle ---------- */
  #fx { position:absolute; inset:0; display:none; overflow:hidden; z-index:8; }
  #fx .sweep { position:absolute; inset:-20%; opacity:.9; }
  #fx .spark { position:absolute; border-radius:50%; opacity:0; }

  /* ---------- Fliegender Licht-Wellen-Band (von Handy zu Handy) ---------- */
  #lightwave { position:absolute; top:0; bottom:0; width:55vw; display:none;
               background:linear-gradient(90deg, transparent, rgba(255,209,102,.0) 0%,
                 rgba(255,209,102,.55) 30%, rgba(255,107,107,.8) 50%,
                 rgba(255,209,102,.55) 70%, rgba(255,209,102,0) 100%);
               box-shadow:0 0 60px 20px rgba(255,209,102,.4);
               pointer-events:none; z-index:7; }

  /* ---------- Buchstabe ---------- */
  #letter { position:absolute; inset:0; display:none; flex-direction:column; align-items:center;
            justify-content:center; z-index:30; text-align:center; padding:8px; }
  #letter .ch { font-size:min(94vw, 80vh); font-weight:900; line-height:1;
                background:linear-gradient(180deg,#fff 10%, #ffd166 55%, #ff6b6b);
                -webkit-background-clip:text; background-clip:text; color:transparent;
                filter:drop-shadow(0 0 30px rgba(255,215,100,.8));
                letter-spacing:-.02em; }
  #letter .ch.in { animation:letterIn 1s cubic-bezier(.2,1.4,.4,1) forwards; transform:scale(0); }
  @keyframes letterIn { 0%{transform:scale(0) rotate(-30deg); opacity:0;}
                        60%{transform:scale(1.25) rotate(4deg); opacity:1;}
                        80%{transform:scale(.96) rotate(-2deg);}
                        100%{transform:scale(1) rotate(0);} }
  #confetti { position:absolute; inset:0; pointer-events:none; overflow:hidden; }

  /* ---------- Finale (nur Konfetti, kein Text – Buchstabe bleibt stehen) ---------- */
  #finale { position:absolute; inset:0; display:none; z-index:40;
            pointer-events:none; }

  .hidden { display:none !important; }
</style>
</head>
<body>
<div id="screen">

  <div id="login">
    <h1>🎂 Happy Birthday!</h1>
    <p>Gib deinen Namen ein, damit alle wissen, in welcher Reihenfolge die Handys gehalten werden.</p>
    <input id="nameInput" type="text" placeholder="Dein Name" maxlength="20" autocomplete="off" />
    <button id="joinBtn">Verbinden</button>
    <div class="ready-tag" id="readyTag"></div>
  </div>

  <div id="wait">
    <div class="ringwrap">
      <div class="ring bg"></div>
      <div class="ring spin"></div>
      <div class="heart">💜</div>
    </div>
    <div class="name" id="waitName">Warte auf den Start…</div>
    <div class="pos" id="waitPos"></div>
  </div>

  <div id="countdown"><div class="cdwrap">
      <div class="cdring"></div>
      <div class="cdinner"><span class="num" id="cdNum">3</span></div>
  </div></div>
  <div id="flash"></div>
  <div id="fx"><div class="sweep" id="sweep"></div></div>
  <div id="lightwave"></div>

  <div id="letter">
    <div id="confetti"></div>
    <span class="ch" id="letterCh">A</span>
  </div>

  <div id="finale">
    <div id="confettiFinale"></div>
  </div>

</div>

<script>
const ws = new WebSocket(location.origin.replace(/^http/,'ws'));
const $ = (id) => document.getElementById(id);

// ===== Bildschirm anlassen (kein Sperrbildschirm, solange die Seite offen ist) =====
let wakeLock = null;
async function requestWakeLock() {
  try {
    if ("wakeLock" in navigator) {
      wakeLock = await navigator.wakeLock.request("screen");
    }
  } catch (e) {
    // Nicht unterstützt oder abgelehnt – dann läuft die Seite einfach normal weiter
  }
}
// Beim Öffnen der Seite anfordern
requestWakeLock();
// Wenn die Seite wieder sichtbar wird (z.B. vom Home-Bildschirm zurück), neu anfordern,
// da der Browser den Wake Lock beim Verstecken der Seite automatisch freigibt.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") requestWakeLock();
});

// ===== Konfiguration =====
const MESSAGE = "HAPPY BIRTHDAY"; // 14 Zeichen (inkl. Leerzeichen)

// ===== Zustand =====
let myId = localStorage.getItem("mom60_id") || null;
let myName = localStorage.getItem("mom60_name") || "";
let myPos = 0;        // Show-Position (Index in sortierter aktiver Liste)
let displayCount = 0; // Anzahl aktiver Geräte
let joined = false;
let inShow = false;   // true, sobald die Show läuft

// ===== Clock-Synchronisation (damit alle Handys gleichzeitig starten) =====
let clockOffset = 0;      // geschätzter Unterschied: Server-Zeit - Handy-Zeit
let bestSync = null;      // { rtt, offset } der besten (schnellsten) Messung
let pendingSyncSend = null; // clientSend-Timestamp der laufenden Messung
let syncDone = false;

// Geschätzte aktuelle Server-Zeit
function serverNow() { return Date.now() + clockOffset; }

// Mehrere RTT-Messungen durchführen, die beste (niedrigste Latenz) übernehmen
function initClockSync() {
  syncDone = false;
  bestSync = null;
  for (let i = 0; i < 4; i++) {
    setTimeout(sendSync, i * 120);
  }
}
function sendSync() {
  const sendT = Date.now();
  pendingSyncSend = sendT;
  ws.send(JSON.stringify({ type: "time-sync", clientSend: sendT }));
}
function handleTimeSync(m) {
  if (m.clientSend !== pendingSyncSend) return;
  const receiveT = Date.now();
  const rtt = receiveT - m.clientSend;       // Round-Trip-Zeit
  const oneWay = rtt / 2;                     // geschätzte einfache Latenz
  const serverNowAtReceive = m.serverTime + oneWay;
  const offset = serverNowAtReceive - receiveT;
  if (!bestSync || rtt < bestSync.rtt) bestSync = { rtt, offset };
  pendingSyncSend = null;
  // Nach der letzten Messung den besten Offset übernehmen
  clockOffset = bestSync.offset;
  syncDone = true;
}

// ===== Anmelden =====
if (myName) $("nameInput").value = myName;

function join() {
  myName = $("nameInput").value.trim() || "Unbenannt";
  localStorage.setItem("mom60_name", myName);
  if (!myId) { myId = "d" + Math.random().toString(36).slice(2,10); localStorage.setItem("mom60_id", myId); }
  initAudio(); // Audio durch den Nutzer-Klick freischalten
  $("readyTag").textContent = "Verbinde…";
  ws.send(JSON.stringify({ type:"register-display", id:myId, name:myName }));
  joined = true;
}

$("joinBtn").onclick = join;
$("nameInput").addEventListener("keydown", (e)=>{ if(e.key==="Enter") join(); });

// ===== WebSocket =====
ws.onopen = () => { if (joined) join(); };

ws.onmessage = (e) => {
  const m = JSON.parse(e.data);

  if (m.type === "registered") {
    myId = m.id;
    localStorage.setItem("mom60_id", myId);
    $("login").classList.add("hidden");
    $("wait").style.display = "flex";
    $("waitName").textContent = "Hallo " + myName + " – warte auf den Start…";
    ws.send(JSON.stringify({ type:"sync-request" }));
    initClockSync(); // Uhr synchronisieren, damit der Countdown überall gleichzeitig startet
  }

  if (m.type === "time-sync") {
    handleTimeSync(m);
  }

  if (m.type === "state") {
    computePosition(m.displays);
  }

  if (m.type === "event") handleEvent(m);
};

// ===== Position berechnen =====
function computePosition(displays) {
  const active = displays
    .filter(d => d.active !== false)
    .sort((a,b) => a.order - b.order);
  displayCount = active.length;
  const idx = active.findIndex(d => d.id === myId);
  if (idx >= 0) myPos = idx;
  $("waitPos").textContent = displayCount > 0
    ? "Du bist Gerät #" + (idx+1) + " von " + displayCount
    : "";
}

// ===== Events =====
function handleEvent(m) {
  if (m.event === "pending") {
    $("waitName").textContent = "Alle bereit – Countdown startet gleich!";
    // Uhr direkt vor dem Countdown nochmal frisch abgleichen,
    // damit der Start wirklich auf allen Handys gleichzeitig passiert.
    initClockSync();
  }
  if (m.event === "sequence") beginSequence(m.payload);
}

let SEQ = null;
const COUNT_START = 10;      // Countdown von 10 abwärts
const LETTER_STEP = 400;     // Zeit (ms), die der Buchstaben-Durchlauf pro Handy braucht

function beginSequence(p) {
  SEQ = p;
  inShow = true;
  $("screen").classList.add("bg-anim");
  hideWait();
  // Countdown von 10 nach 1 – mit Tick-Sound und Welle über alle Handys
  for (let i = 0; i < COUNT_START; i++) {
    const n = COUNT_START - i;
    schedule(p.t1 + i * 1000, () => { countdown(n); tickSound(n); });
  }
  // Welle läuft WÄHREND des Countdowns über alle Handys (ein Durchgang pro Sekunde)
  countdownWave(p.t1);
  // Kurzer Blitz direkt nach dem Countdown, dann sofort Happy Birthday
  schedule(p.t1 + COUNT_START * 1000, () => flashOnce());
  // Buchstaben: kommen direkt nach dem Countdown, wandern von links nach rechts
  // über alle Handys und bleiben dann die ganze Zeit stehen
  schedule(p.t2, () => startLetterSweep());
  schedule(p.t3, () => showFinale());
}
// Wichtig für Synchronisation: Verzögerung anhand der SERVER-Zeit berechnen,
// nicht anhand der (evtl. abweichenden) Handy-Uhr.
function schedule(time, fn) { setTimeout(fn, Math.max(0, time - serverNow())); }

// ===== Soundeffekte (Web Audio, ohne Dateien) =====
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
}
// Ein einzelner Ton
function tone(freq, dur, type, when, vol) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime + (when || 0);
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || "sine";
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(vol || 0.3, t + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + dur + 0.02);
}
// Tick bei jeder Countdown-Zahl; die "1" klingt besonders
function tickSound(n) {
  if (n > 1) tone(700, 0.09, "square", 0, 0.18);
  else {
    tone(880, 0.12, "square", 0, 0.22);
    tone(1174, 0.16, "square", 0.12, 0.22);
  }
}
// Fanfare, wenn die Buchstaben erscheinen
function fanfare() {
  const notes = [523, 659, 784, 1046, 1318];
  notes.forEach((f, i) => tone(f, 0.22, "triangle", i * 0.11, 0.28));
  tone(1568, 0.5, "triangle", notes.length * 0.11, 0.28);
}
// Festlicher Schlussakkord
function celebration() {
  tone(523, 0.6, "triangle", 0, 0.3);
  tone(659, 0.6, "triangle", 0.02, 0.3);
  tone(784, 0.6, "triangle", 0.04, 0.3);
  tone(1046, 1.1, "triangle", 0.1, 0.32);
}

// ===== Welle über alle Handys WÄHREND des Countdowns =====
// Ein leuchtender Licht-Band wandert pro Sekunde einmal von links nach rechts
// über die ganze Handy-Reihe. Jedes Handy startet zeitlich exakt versetzt,
// sodass es wie EIN durchgehendes Licht wirkt.
function countdownWave(t1) {
  const N = Math.max(1, displayCount);
  const bandDur = 1000 / N; // Zeit, die das Band pro Handy braucht
  for (let i = 0; i < COUNT_START; i++) {
    schedule(t1 + i * 1000 + myPos * bandDur, () => sweepBand(bandDur));
  }
}
function sweepBand(bandDur) {
  const band = $("lightwave");
  band.style.display = "block";
  band.style.transition = "none";
  band.style.left = "-60%";
  void band.offsetWidth;
  band.style.transition = "left " + bandDur + "ms linear";
  band.style.left = "100%";
}

// "Warten"-Screen sauber ausblenden
function hideWait() {
  const w = $("wait");
  w.classList.add("fade-out");
  setTimeout(() => { if (!inShow) return; w.style.display = "none"; w.classList.remove("fade-out"); }, 480);
}

// ===== Countdown =====
function countdown(n) {
  hideWait();
  $("countdown").style.display = "flex";
  const num = $("cdNum");
  num.textContent = n;
  num.classList.remove("pop"); void num.offsetWidth; num.classList.add("pop");
}

// ===== Kurzer Blitz direkt nach dem Countdown =====
function flashOnce() {
  const fl = $("flash");
  fl.style.display = "block";
  fl.style.background = "#ffffff";
  setTimeout(()=>{ fl.style.background = "#ffe9a8"; }, 70);
  setTimeout(()=>{ fl.style.background = "#ffffff"; }, 140);
  setTimeout(()=>{ fl.style.display = "none"; }, 320);
}

// ===== Licht-Welle (von einem Handy zum nächsten) =====
// Jedes Handy lässt das Licht-Band in seiner Position von links nach rechts
// wandern. Der Start ist zeitlich exakt versetzt, sodass es wie EIN durchgehendes
// Licht wirkt, das über die ganze Handy-Reihe läuft.
function flyWave(startTime, step) {
  const band = $("lightwave");
  const delay = Math.max(0, startTime - serverNow());
  band.style.display = "block";
  band.style.transition = "none";
  band.style.left = "-60%";
  void band.offsetWidth;
  band.style.transition = "left " + step + "ms linear";
  setTimeout(() => {
    band.style.left = "100%";
  }, delay);
}

// ===== Buchstabe =====
// Jedes Handy zeigt GENAU EINEN Buchstaben, sodass alle zusammen
// "HAPPY BIRTHDAY" ergeben (jedes Handy = 1 Zeichen). Position myPos = Index im Text.
// Bei mehr Handys als Zeichen zeigen die übrigen Handys 🎉.
function assignContent(position) {
  const chars = MESSAGE.split("");
  return position < chars.length ? chars[position] : "";
}

// Buchstaben erscheinen von links nach rechts über die ganze Handy-Reihe
// und bleiben dann stehen (verschwinden nicht mehr bis zum Finale).
function startLetterSweep() {
  const step = LETTER_STEP;
  // Wann die Licht-Welle dieses Handy erreicht (anhand der Server-Zeit, damit
  // alle Handys exakt gleichzeitig arbeiten)
  const nowServer = serverNow();
  const myReveal = nowServer + myPos * step;
  // Licht-Welle über die Reihe laufen lassen
  flyWave(myReveal, step);
  // Buchstabe dieses Handys genau dann einblenden
  setTimeout(() => showLetter(), Math.max(0, myReveal - serverNow()));
  // Fanfare nur auf dem ersten Handy spielen (Position 0)
  if (myPos === 0) schedule(nowServer, fanfare);
}

function showLetter() {
  $("countdown").style.display = "none";
  $("fx").style.display = "none";
  $("lightwave").style.display = "none";
  const content = assignContent(myPos);
  const ch = $("letterCh");
  ch.textContent = content || "🎉";
  ch.classList.remove("in"); void ch.offsetWidth; ch.classList.add("in");
  $("letter").style.display = "flex";
}

function launchConfetti(containerId) {
  const c = $(containerId || "confetti");
  c.innerHTML = "";
  const style = document.createElement("style");
  style.textContent = "@keyframes fall{to{transform:translate(var(--dx),112vh) rotate(720deg);}}";
  style.id = "confettiStyle";
  const old = document.getElementById("confettiStyle"); if (old) old.remove();
  document.head.appendChild(style);
  const colors = ["#ff6b6b","#f06595","#ffd166","#6bcbff","#7dff8a","#c084fc"];
  for (let i=0;i<60;i++){
    const p = document.createElement("div");
    const w = 6 + Math.random()*8;
    p.style.cssText = "position:absolute;left:"+Math.random()*100+"%;top:-12%;width:"+w+"px;"+
      "height:"+(w*1.6)+"px;border-radius:2px;"+
      "background:"+colors[i%colors.length]+";"+
      "animation:fall "+(1.8+Math.random()*2.2)+"s linear "+(Math.random()*0.6)+"s forwards;";
    p.style.setProperty("--dx", (Math.random()*160-80)+"px");
    c.appendChild(p);
  }
}

// ===== Finale (Konfetti über dem stehenbleibenden Buchstaben) =====
function showFinale() {
  // Buchstabe bleibt die ganze Zeit sichtbar – nur Konfetti kommt dazu
  $("countdown").style.display = "none";
  $("fx").style.display = "none";
  $("lightwave").style.display = "none";
  $("finale").style.display = "block";
  launchConfetti("confettiFinale");
  celebration();
}
</script>
<style>
@keyframes twinkle { 0%,100%{opacity:.2; transform:scale(.6);} 50%{opacity:1; transform:scale(1.2);} }
</style>
</body>
</html>
