<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#05030f" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Happy Birthday" />
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<title>Happy Birthday 🎂</title>
<script>
// Service Worker registrieren (für Installation als App + Offline)
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").catch(() => {});
  });
}
</script>
<style>
  * { box-sizing: border-box; margin:0; padding:0; }
  html, body { height:100%; overflow:hidden; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background:#05030f; color:#fff;
         display:flex; align-items:center; justify-content:center; }
  #screen { position:relative; width:100%; height:100%; display:flex; flex-direction:column;
            align-items:center; justify-content:center; overflow:hidden;
            background:radial-gradient(circle at 50% 20%, #1c1140, #05030f 70%); }
  /* Leichtgewichtiger, pulsierender Farb-Glow über dem Hintergrund.
     Nur opacity wird animiert (GPU-beschleunigt & flüssig), NICHT background –
     das Animieren von Gradienten ist teuer und ruckelt. */
  #bgGlow { position:absolute; inset:-20%; pointer-events:none; z-index:1;
            background:radial-gradient(circle at 50% 35%, rgba(58,21,80,.65), transparent 70%);
            opacity:.35; }
  #screen.bg-anim #bgGlow { animation:bgPulse 8s ease-in-out infinite; }
  @keyframes bgPulse { 0%,100%{opacity:.28;} 50%{opacity:.6;} }

  /* ---------- Anmelden ---------- */
  #login { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
           justify-content:center; gap:18px; padding:24px; text-align:center; z-index:20; }
  #login h1 { font-size:1.5rem; font-weight:700; }
  #login p { opacity:.75; font-size:.95rem; max-width:300px; }
  #login input { font-size:1.2rem; padding:14px 18px; border-radius:12px; border:2px solid rgba(255,255,255,.3);
                 background:rgba(255,255,255,.08); color:#fff; text-align:center; width:80%; max-width:280px; }
  #login button { font-size:1.1rem; font-weight:700; padding:14px 34px; border:none; border-radius:12px;
                  background:linear-gradient(135deg,#ff6b6b,#f06595); color:#fff; cursor:pointer;
                  box-shadow:0 8px 24px rgba(240,101,149,.4); }
  #login button:active { transform:scale(.96); }
  .ready-tag { font-size:.85rem; opacity:.8; margin-top:8px; min-height:1.2em; }

  /* ---------- Warten ---------- */
  #wait { position:absolute; inset:0; display:none; flex-direction:column; align-items:center;
          justify-content:center; gap:22px; z-index:10; text-align:center; padding:20px; }
  .ringwrap { position:relative; width:110px; height:110px; }
  .ringwrap .ring { position:absolute; inset:0; border-radius:50%; }
  .ringwrap .ring.bg { border:4px solid rgba(255,255,255,.12); }
  .ringwrap .ring.spin { border:4px solid transparent; border-top-color:#ffd166; border-right-color:#f06595;
                         animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .ringwrap .heart { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
                     font-size:2.2rem; animation:beat 1.2s ease-in-out infinite; }
  @keyframes beat { 0%,100%{transform:scale(1);} 30%{transform:scale(1.18);} }
  #wait .name { font-size:1.25rem; font-weight:700; text-shadow:0 2px 20px rgba(255,209,102,.3); }
  #wait .pos { font-size:.9rem; opacity:.85; }
  #wait.fade-out { opacity:0; transition:opacity .45s ease; }

  /* ---------- Countdown ---------- */
  #countdown { position:absolute; inset:0; display:none; align-items:center; justify-content:center;
               z-index:10; }
  #countdown .cdwrap { position:relative; display:flex; align-items:center; justify-content:center;
                       width:min(70vw,320px); height:min(70vw,320px); }
  #countdown .cdring { position:absolute; inset:0; border-radius:50%;
                       background:conic-gradient(#ff6b6b, #f06595, #ffd166, #ff6b6b);
                       filter:blur(2px); opacity:.9; }
  #countdown .cdinner { position:absolute; inset:8px; border-radius:50%;
                        background:radial-gradient(circle at 50% 35%, #2a1a4a, #05030f);
                        display:flex; align-items:center; justify-content:center; }
  #countdown .num { font-size:min(34vw, 180px); font-weight:900; line-height:1;
                    background:linear-gradient(180deg,#fff,#ffd166);
                    -webkit-background-clip:text; background-clip:text; color:transparent;
                    filter:drop-shadow(0 0 24px rgba(255,209,102,.55)); }
  .pop { animation:pop .9s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop { 0%{transform:scale(2.4) rotate(-6deg); opacity:0;}
                   35%{transform:scale(.9) rotate(2deg); opacity:1;}
                   100%{transform:scale(1) rotate(0);} }

  /* ---------- Blitz ---------- */
  #flash { position:absolute; inset:0; display:none; z-index:5; }

  /* ---------- Hochauflösendes Canvas für alle Animationseffekte ---------- */
  #waveCanvas { position:absolute; inset:0; width:100%; height:100%; display:block;
                pointer-events:none; z-index:8; }

  /* Sanfter Glow hinter den Buchstaben */
  #letterGlow { position:absolute; inset:0; display:none; pointer-events:none; z-index:6;
                background:radial-gradient(circle at 50% 55%, rgba(255,209,102,.28), rgba(240,101,149,.14) 45%, transparent 72%);
                animation:glowPulse 3.2s ease-in-out infinite; }
  @keyframes glowPulse { 0%,100%{opacity:.6; transform:scale(1);} 50%{opacity:1; transform:scale(1.06);} }

  /* ---------- Buchstabe ---------- */
  #letter { position:absolute; inset:0; display:none; flex-direction:column; align-items:center;
            justify-content:center; z-index:30; text-align:center; padding:8px; }
  #letter .ch { font-size:min(94vw, 80vh); font-weight:900; line-height:1;
                background:linear-gradient(180deg,#fff 10%, #ffd166 55%, #ff6b6b);
                -webkit-background-clip:text; background-clip:text; color:transparent;
                filter:drop-shadow(0 0 30px rgba(255,215,100,.8));
                letter-spacing:-.02em; }
  #letter .ch.in { animation:letterIn 1s cubic-bezier(.2,1.4,.4,1) forwards; transform:scale(0); }
  @keyframes letterIn { 0%{transform:scale(0) rotate(-30deg); opacity:0;}
                        60%{transform:scale(1.25) rotate(4deg); opacity:1;}
                        80%{transform:scale(.96) rotate(-2deg);}
                        100%{transform:scale(1) rotate(0);} }

  .hidden { display:none !important; }
</style>
</head>
<body>
<div id="screen">
  <div id="bgGlow"></div>

  <div id="login">
    <h1>🎂 Happy Birthday!</h1>
    <p>Gib deinen Namen ein, damit alle wissen, in welcher Reihenfolge die Handys gehalten werden.</p>
    <input id="nameInput" type="text" placeholder="Dein Name" maxlength="20" autocomplete="off" />
    <button id="joinBtn">Verbinden</button>
    <div class="ready-tag" id="readyTag"></div>
  </div>

  <div id="wait">
    <div class="ringwrap">
      <div class="ring bg"></div>
      <div class="ring spin"></div>
      <div class="heart">💜</div>
    </div>
    <div class="name" id="waitName">Warte auf den Start…</div>
    <div class="pos" id="waitPos"></div>
  </div>

  <div id="countdown"><div class="cdwrap">
      <div class="cdring"></div>
      <div class="cdinner"><span class="num" id="cdNum">10</span></div>
  </div></div>
  <div id="flash"></div>
  <canvas id="waveCanvas"></canvas>
  <div id="letterGlow"></div>

  <div id="letter">
    <span class="ch" id="letterCh">A</span>
  </div>

</div>

<script>
const ws = new WebSocket(location.origin.replace(/^http/,'ws'));
const $ = (id) => document.getElementById(id);

// ===== Bildschirm anlassen (kein Sperrbildschirm, solange die Seite offen ist) =====
let wakeLock = null;
async function requestWakeLock() {
  try {
    if ("wakeLock" in navigator) {
      wakeLock = await navigator.wakeLock.request("screen");
    }
  } catch (e) {
    // Nicht unterstützt oder abgelehnt – dann läuft die Seite einfach normal weiter
  }
}
// Beim Öffnen der Seite anfordern
requestWakeLock();
// Wenn die Seite wieder sichtbar wird (z.B. vom Home-Bildschirm zurück), neu anfordern,
// da der Browser den Wake Lock beim Verstecken der Seite automatisch freigibt.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") requestWakeLock();
});

// ===== Konfiguration =====
const MESSAGE = "HAPPY BIRTHDAY"; // 14 Zeichen (inkl. Leerzeichen)

// ===== Zustand =====
let myId = localStorage.getItem("mom60_id") || null;
let myName = localStorage.getItem("mom60_name") || "";
let myPos = 0;        // Show-Position (Index in sortierter aktiver Liste)
let displayCount = 0; // Anzahl aktiver Geräte
let joined = false;
let inShow = false;   // true, sobald die Show läuft

// ===== Clock-Synchronisation (damit alle Handys gleichzeitig starten) =====
let clockOffset = 0;      // geschätzter Unterschied: Server-Zeit - Handy-Zeit
let bestSync = null;      // { rtt, offset } der besten (schnellsten) Messung
let pendingSyncSend = null; // clientSend-Timestamp der laufenden Messung
let syncDone = false;

// Geschätzte aktuelle Server-Zeit
function serverNow() { return Date.now() + clockOffset; }

// Mehrere RTT-Messungen durchführen, die beste (niedrigste Latenz) übernehmen
function initClockSync() {
  syncDone = false;
  bestSync = null;
  for (let i = 0; i < 4; i++) {
    setTimeout(sendSync, i * 120);
  }
}
function sendSync() {
  const sendT = Date.now();
  pendingSyncSend = sendT;
  ws.send(JSON.stringify({ type: "time-sync", clientSend: sendT }));
}
function handleTimeSync(m) {
  if (m.clientSend !== pendingSyncSend) return;
  const receiveT = Date.now();
  const rtt = receiveT - m.clientSend;       // Round-Trip-Zeit
  const oneWay = rtt / 2;                     // geschätzte einfache Latenz
  const serverNowAtReceive = m.serverTime + oneWay;
  const offset = serverNowAtReceive - receiveT;
  if (!bestSync || rtt < bestSync.rtt) bestSync = { rtt, offset };
  pendingSyncSend = null;
  // Nach der letzten Messung den besten Offset übernehmen
  clockOffset = bestSync.offset;
  syncDone = true;
}

// ===== Anmelden =====
if (myName) $("nameInput").value = myName;

function join() {
  myName = $("nameInput").value.trim() || "Unbenannt";
  localStorage.setItem("mom60_name", myName);
  if (!myId) { myId = "d" + Math.random().toString(36).slice(2,10); localStorage.setItem("mom60_id", myId); }
  initAudio(); // Audio durch den Nutzer-Klick freischalten
  $("readyTag").textContent = "Verbinde…";
  ws.send(JSON.stringify({ type:"register-display", id:myId, name:myName }));
  joined = true;
}

$("joinBtn").onclick = join;
$("nameInput").addEventListener("keydown", (e)=>{ if(e.key==="Enter") join(); });

// ===== WebSocket =====
ws.onopen = () => { if (joined) join(); };

ws.onmessage = (e) => {
  const m = JSON.parse(e.data);

  if (m.type === "registered") {
    myId = m.id;
    localStorage.setItem("mom60_id", myId);
    $("login").classList.add("hidden");
    $("wait").style.display = "flex";
    $("waitName").textContent = "Hallo " + myName + " – warte auf den Start…";
    ws.send(JSON.stringify({ type:"sync-request" }));
    initClockSync(); // Uhr synchronisieren, damit der Countdown überall gleichzeitig startet
  }

  if (m.type === "time-sync") {
    handleTimeSync(m);
  }

  if (m.type === "state") {
    computePosition(m.displays);
  }

  if (m.type === "event") handleEvent(m);
};

// ===== Position berechnen =====
function computePosition(displays) {
  const active = displays
    .filter(d => d.active !== false)
    .sort((a,b) => a.order - b.order);
  displayCount = active.length;
  const idx = active.findIndex(d => d.id === myId);
  if (idx >= 0) myPos = idx;
  $("waitPos").textContent = displayCount > 0
    ? "Du bist Gerät #" + (idx+1) + " von " + displayCount
    : "";
}

// ===== Events =====
function handleEvent(m) {
  if (m.event === "pending") {
    $("waitName").textContent = "Alle bereit – Countdown startet gleich!";
    // Uhr direkt vor dem Countdown nochmal frisch abgleichen,
    // damit der Start wirklich auf allen Handys gleichzeitig passiert.
    initClockSync();
  }
  if (m.event === "sequence") beginSequence(m.payload);
}

let SEQ = null;
const COUNT_START = 10;      // Countdown von 10 abwärts
const LETTER_STEP = 400;     // Zeit (ms), die der Buchstaben-Durchlauf pro Handy braucht

function beginSequence(p) {
  SEQ = p;
  inShow = true;
  $("screen").classList.add("bg-anim");
  hideWait();
  // Countdown von 10 nach 1 – mit Tick-Sound und Welle über alle Handys
  for (let i = 0; i < COUNT_START; i++) {
    const n = COUNT_START - i;
    schedule(p.t1 + i * 1000, () => { countdown(n); tickSound(n); });
  }
  // Welle & Partikel starten – läuft über alle Handys als durchgehende Animation
  startWaveAnimation();
  startSpawner();
  // Kurzer Blitz direkt nach dem Countdown, dann sofort Happy Birthday
  schedule(p.t1 + COUNT_START * 1000, () => flashOnce());
  // Buchstaben: kommen direkt nach dem Countdown, wandern von links nach rechts
  // über alle Handys und bleiben dann die ganze Zeit stehen
  schedule(p.t2, () => startLetterSweep());
  schedule(p.t3, () => showFinale());
}
// Wichtig für Synchronisation: Verzögerung anhand der SERVER-Zeit berechnen,
// nicht anhand der (evtl. abweichenden) Handy-Uhr.
function schedule(time, fn) { setTimeout(fn, Math.max(0, time - serverNow())); }

// ===== Soundeffekte (Web Audio, ohne Dateien) =====
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
}
// Ein einzelner Ton
function tone(freq, dur, type, when, vol) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime + (when || 0);
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || "sine";
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(vol || 0.3, t + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + dur + 0.02);
}
// Tick bei jeder Countdown-Zahl; die "1" klingt besonders
function tickSound(n) {
  if (n > 1) tone(700, 0.09, "square", 0, 0.18);
  else {
    tone(880, 0.12, "square", 0, 0.22);
    tone(1174, 0.16, "square", 0.12, 0.22);
  }
}
// Fanfare, wenn die Buchstaben erscheinen
function fanfare() {
  const notes = [523, 659, 784, 1046, 1318];
  notes.forEach((f, i) => tone(f, 0.22, "triangle", i * 0.11, 0.28));
  tone(1568, 0.5, "triangle", notes.length * 0.11, 0.28);
}
// Festlicher Schlussakkord
function celebration() {
  tone(523, 0.6, "triangle", 0, 0.3);
  tone(659, 0.6, "triangle", 0.02, 0.3);
  tone(784, 0.6, "triangle", 0.04, 0.3);
  tone(1046, 1.1, "triangle", 0.1, 0.32);
}

// ===== Welle über alle Handys WÄHREND des Countdowns =====
// ============================================================
//  HOCHAUFLÖSENDE CANVAS-ANIMATION ÜBER ALLE HANDYS
//  Jedes Handy rendert nur seinen Streifen eines gemeinsamen,
//  über die Server-Zeit synchronisierten Gesamtbilds. Dadurch
//  wirkt die Bewegung als EINE durchgehende Welle über die
//  ganze Handy-Reihe (wie ein großes, zusammenhängendes Bild).
// ============================================================
const canvas = $("waveCanvas");
const ctx = canvas.getContext("2d");
let canvasW = 0, canvasH = 0, dpr = 1;
let animActive = false;   // Animationsschleife läuft?
let animStartServer = 0;  // Server-Zeit beim Start der Schleife

// Canvas in hoher Auflösung skalieren (devicePixelRatio beachten)
function resizeCanvas() {
  dpr = window.devicePixelRatio || 1;
  const r = canvas.getBoundingClientRect();
  canvasW = r.width; canvasH = r.height;
  canvas.width = Math.max(1, Math.round(r.width * dpr));
  canvas.height = Math.max(1, Math.round(r.height * dpr));
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

// Virtuelle Welt: die ganze Handy-Reihe hat die Breite `displayCount`
// (in Einheiten "Handy-Breite"). Dieses Handy zeigt [myPos, myPos+1].
const WORLD = () => Math.max(1, displayCount);
// Welt-Koordinate -> Bildschirm-x auf diesem Handy
function wx(wx) { return (wx - myPos) * canvasW; }
// Ist eine Welt-x auf diesem Handy sichtbar?
function visible(wx) { return wx >= myPos - 0.5 && wx <= myPos + 1.5; }

// Partikel-Arten: glow-Wellen, Funken, Herzen, Konfetti
let fxParticles = [];
let fxTime = 0; // Sekunden seit Start (auf Server-Zeit basiert)

// Licht-Wellen: mehrere Wellen, die mit konstanter Geschwindigkeit
// über die GESAMTE Reihe wandern. phase bestimmt den Startpunkt.
const WAVE_PERIOD = 5000; // ms für EINEN Durchlauf über alle Handys
const WAVE_DEFS = [
  { color: "#ffd166", width: 0.38, speed: 1.0,  phase: 0.0,  trail: 1.6 },
  { color: "#f06595", width: 0.30, speed: 0.9,  phase: 0.33, trail: 1.5 },
  { color: "#6bcbff", width: 0.26, speed: 0.75, phase: 0.66, trail: 1.5 },
  { color: "#c084fc", width: 0.26, speed: 0.6,  phase: 0.15, trail: 1.4 },
];

// Obergrenze für gleichzeitige Partikel – verhindert, dass die Anzahl
// unkontrolliert wächst und die Performance auf dem Handy leidet.
const MAX_PARTICLES = 220;
function atCap() { return fxParticles.length >= MAX_PARTICLES; }

function spawnHeart() {
  if (atCap()) return;
  fxParticles.push({
    kind: "heart",
    x: canvasW * Math.random(),
    y: canvasH + 20,
    vy: -(40 + Math.random() * 60),
    vx: (Math.random() - 0.5) * 20,
    sway: 1 + Math.random(),
    swayAmp: 10 + Math.random() * 20,
    life: 8,
    age: 0,
    size: (14 + Math.random() * 18) * (dpr > 1 ? 1 : 1.6),
    color: ["#ff6b9d", "#ff9ecf", "#f06595", "#c084fc"][Math.floor(Math.random() * 4)],
  });
}

function spawnConfetti() {
  if (atCap()) return;
  const colors = ["#ff6b6b","#f06595","#ffd166","#6bcbff","#7dff8a","#c084fc","#ff9ecf"];
  fxParticles.push({
    kind: "confetti",
    x: canvasW * Math.random(),
    y: -20,
    vy: 80 + Math.random() * 120,
    vx: (Math.random() - 0.5) * 60,
    rot: Math.random() * Math.PI * 2,
    vr: (Math.random() - 0.5) * 6,
    life: 12,
    age: 0,
    size: (5 + Math.random() * 6) * (dpr > 1 ? 1 : 1.5),
    color: colors[Math.floor(Math.random() * colors.length)],
  });
}

// Ein Stern-Funkeln im Hintergrund (nur auf diesem Handy verteilt)
const twinkles = [];
function initTwinkles() {
  twinkles.length = 0;
  for (let i = 0; i < 40; i++) {
    twinkles.push({
      x: Math.random(), y: Math.random(),
      size: 0.5 + Math.random() * 1.6,
      speed: 1 + Math.random() * 3,
      phase: Math.random() * Math.PI * 2,
      gold: Math.random() < 0.5,
    });
  }
}
initTwinkles();

// Haupt-Renderfunktion: wird jede Frame aufgerufen
function renderFrame(nowServer) {
  ctx.clearRect(0, 0, canvasW, canvasH);
  const t = animTime(); // Sekunden seit dem gemeinsamen Start (SEQ.t0)

  // --- Hintergrund-Funkeln (Sterne / Goldstaub) ---
  for (const s of twinkles) {
    const a = 0.25 + 0.5 * (0.5 + 0.5 * Math.sin(s.speed * t * Math.PI + s.phase));
    ctx.globalAlpha = a;
    ctx.fillStyle = s.gold ? "#ffd166" : "#ffffff";
    ctx.beginPath();
    ctx.arc(s.x * canvasW, s.y * canvasH, s.size * (dpr > 1 ? 1 : 1.8), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // --- Durchgehende Licht-Wellen über die ganze Reihe (perfomant) ---
  // Pro Welle nur 2 Fills: ein schmaler Schweif-Streifen (linearer Gradient)
  // + ein kompakter Glow an der Spitze. Keine teuren Vollbild-Fills.
  const h2 = canvasH / 2;
  for (const w of WAVE_DEFS) {
    const cx = ((t * 1000 / WAVE_PERIOD) * w.speed + w.phase) % 1;
    const center = cx * (WORLD() + 1) - 0.5; // Welt-Spitze der Welle
    const back = center - w.trail;           // Welt-Ende des Schweifs
    const x0 = wx(back);
    const x1 = wx(center);
    // Nur zeichnen, wenn der Schweifbereich dieses Handy überhaupt berührt
    if (x1 < -canvasW * 0.5 || x0 > canvasW * 1.5) continue;
    // Schweif: schmaler Streifen mit linearem Farbverlauf in Bewegungsrichtung
    const bandW = Math.max(1, Math.abs(x1 - x0));
    const left = Math.min(x0, x1);
    const lg = ctx.createLinearGradient(left, 0, left + bandW, 0);
    lg.addColorStop(0, hexA(w.color, 0));
    lg.addColorStop(1, hexA(w.color, 0.45));
    ctx.fillStyle = lg;
    ctx.fillRect(left, 0, bandW, canvasH);
    // Helle, kompakte Spitze: nur ein schmaler Glow-Bereich
    const glowR = canvasW * w.width;
    const g = ctx.createRadialGradient(x1, h2, 0, x1, h2, glowR);
    g.addColorStop(0, hexA(w.color, 0.9));
    g.addColorStop(0.5, hexA(w.color, 0.35));
    g.addColorStop(1, hexA(w.color, 0));
    ctx.fillStyle = g;
    ctx.fillRect(x1 - glowR, 0, glowR * 2, canvasH);
  }

  // --- Partikel zeichnen & updaten ---
  const dt = 1 / 60;
  for (let i = fxParticles.length - 1; i >= 0; i--) {
    const p = fxParticles[i];
    p.age += dt;
    if (p.age >= p.life) { fxParticles.splice(i, 1); continue; }

    if (p.kind === "spark") {
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 600 * dt;
      const lifeFrac = 1 - p.age / p.life;
      ctx.globalAlpha = lifeFrac;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * lifeFrac, 0, Math.PI * 2);
      ctx.fill();
      // Glow
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 4 * lifeFrac);
      g.addColorStop(0, hexA(p.color, 0.5 * lifeFrac));
      g.addColorStop(1, hexA(p.color, 0));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 4 * lifeFrac, 0, Math.PI * 2); ctx.fill();
    } else if (p.kind === "heart") {
      p.x += Math.sin(p.age * p.sway) * p.swayAmp * dt + p.vx * dt;
      p.y += p.vy * dt;
      const a = p.age < p.life - 1 ? 1 : Math.max(0, (p.life - p.age));
      ctx.globalAlpha = a;
      drawHeart(ctx, p.x, p.y, p.size, p.color);
    } else if (p.kind === "confetti") {
      p.x += p.vx * dt + Math.sin(p.age * 3) * 20 * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = 1;
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.66);
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
}

function drawHeart(c, x, y, s, color) {
  c.save();
  c.translate(x, y);
  c.scale(s / 20, s / 20);
  c.fillStyle = color;
  c.beginPath();
  c.moveTo(0, 5);
  c.bezierCurveTo(-11, -3, -6, -11, 0, -4);
  c.bezierCurveTo(6, -11, 11, -3, 0, 5);
  c.fill();
  c.restore();
}

// Hilfsfunktion: hex-Farbe mit Alpha
function hexA(hex, a) {
  const h = hex.replace("#", "");
  const r = parseInt(h.substring(0, 2), 16);
  const g = parseInt(h.substring(2, 4), 16);
  const b = parseInt(h.substring(4, 6), 16);
  return `rgba(${r},${g},${b},${Math.max(0, Math.min(1, a))})`;
}

// Startet die dauerhafte Canvas-Schleife (Server-Zeit als gemeinsame Uhr)
let rafId = null;
// Referenzzeit für die Animation: an SEQ.t0 verankert, damit ALLE Handys
// exakt dieselbe Wellenphase sehen (perfekte, durchgehende Bewegung über die Reihe).
let animAnchor = 0;
function animTime() { return (serverNow() - animAnchor) / 1000; }
function startWaveAnimation() {
  if (animActive) return;
  animActive = true;
  animAnchor = (SEQ && SEQ.payload && SEQ.payload.t0) ? SEQ.payload.t0 : serverNow();
  animStartServer = serverNow();
  fxParticles = [];
  function loop() {
    if (!animActive) return;
    renderFrame(serverNow());
    rafId = requestAnimationFrame(loop);
  }
  rafId = requestAnimationFrame(loop);
}
function stopWaveAnimation() {
  animActive = false;
  if (rafId) cancelAnimationFrame(rafId);
  ctx.clearRect(0, 0, canvasW, canvasH);
}

// Während der Show immer wieder neue Partikel erzeugen
let fxSpawner = null;
function startSpawner() {
  stopSpawner();
  fxSpawner = setInterval(() => {
    if (!animActive) return;
    const t = animTime();
    // Hauptwelle erzeugt Funken, wenn sie dieses Handy überquert
    const cx = (t * 1000 / WAVE_PERIOD) % 1;
    const center = cx * (WORLD() + 1) - 0.5;
    if (visible(center)) {
      const sx = wx(center);
      // Bei hoher Partikelzahl weniger Funken pro Tick erzeugen
      const n = atCap() ? 0 : (fxParticles.length > MAX_PARTICLES * 0.7 ? 3 : 6);
      for (let i = 0; i < n; i++) {
        fxParticles.push({
          kind: "spark",
          x: sx + (Math.random() - 0.5) * canvasW * 0.2,
          y: canvasH * (0.15 + Math.random() * 0.7),
          vx: (Math.random() - 0.5) * 160,
          vy: -Math.random() * 240 - 60,
          life: 0.8 + Math.random() * 1,
          age: 0,
          size: (2 + Math.random() * 3.5) * (dpr > 1 ? 1 : 1.6),
          color: ["#fff6d8", "#ffd166", "#ff9ecf", "#a5e3ff"][Math.floor(Math.random() * 4)],
        });
      }
    }
    // Ab und zu Herzen aufsteigen lassen (Geburtstags-Theme)
    if (Math.random() < 0.4) spawnHeart();
  }, 120);
}
function stopSpawner() { if (fxSpawner) { clearInterval(fxSpawner); fxSpawner = null; } }

// Konfetti-Regenschauer (z.B. beim Finale)
function confettiBurst(count) {
  for (let i = 0; i < (count || 40); i++) spawnConfetti();
}

// ===== Warten-Screen ausblenden =====
function hideWait() {
  const w = $("wait");
  w.classList.add("fade-out");
  setTimeout(() => { if (!inShow) return; w.style.display = "none"; w.classList.remove("fade-out"); }, 480);
}

// ===== Countdown =====
function countdown(n) {
  hideWait();
  $("countdown").style.display = "flex";
  const num = $("cdNum");
  num.textContent = n;
  num.classList.remove("pop"); void num.offsetWidth; num.classList.add("pop");
}

// ===== Kurzer Blitz direkt nach dem Countdown =====
function flashOnce() {
  const fl = $("flash");
  fl.style.display = "block";
  fl.style.background = "#ffffff";
  setTimeout(()=>{ fl.style.background = "#ffe9a8"; }, 70);
  setTimeout(()=>{ fl.style.background = "#ffffff"; }, 140);
  setTimeout(()=>{ fl.style.display = "none"; }, 320);
}

// ===== Buchstabe =====
// Jedes Handy zeigt GENAU EINEN Buchstaben, sodass alle zusammen
// "HAPPY BIRTHDAY" ergeben (jedes Handy = 1 Zeichen). Position myPos = Index im Text.
// Bei mehr Handys als Zeichen zeigen die übrigen Handys 🎉.
function assignContent(position) {
  const chars = MESSAGE.split("");
  return position < chars.length ? chars[position] : "";
}

// Buchstaben erscheinen von links nach rechts über die ganze Handy-Reihe
// und bleiben dann stehen (verschwinden nicht mehr bis zum Finale).
function startLetterSweep() {
  const step = LETTER_STEP;
  // Wann die Licht-Welle dieses Handy erreicht (anhand der Server-Zeit, damit
  // alle Handys exakt gleichzeitig arbeiten)
  const nowServer = serverNow();
  const myReveal = nowServer + myPos * step;
  // Buchstabe dieses Handys genau dann einblenden
  setTimeout(() => showLetter(), Math.max(0, myReveal - serverNow()));
  // Fanfare nur auf dem ersten Handy spielen (Position 0)
  if (myPos === 0) schedule(nowServer, fanfare);
}

function showLetter() {
  $("countdown").style.display = "none";
  // Sanfter Glow hinter den Buchstaben einschalten (Canvas-Welle läuft weiter)
  $("letterGlow").style.display = "block";
  const content = assignContent(myPos);
  const ch = $("letterCh");
  ch.textContent = content || "🎉";
  ch.classList.remove("in"); void ch.offsetWidth; ch.classList.add("in");
  $("letter").style.display = "flex";
  // Kurzer Konfetti-Funken bei jedem Buchstaben, besonders beim ersten
  confettiBurst(myPos === 0 ? 24 : 8);
}

// ===== Finale (Konfetti über dem stehenbleibenden Buchstaben) =====
function showFinale() {
  // Buchstabe bleibt sichtbar – die Canvas-Welle läuft weiter und es gibt
  // einen großen Konfetti-Regenschauer über ALLE Handys gleichzeitig.
  $("countdown").style.display = "none";
  $("letterGlow").style.display = "block";
  confettiBurst(50);
  celebration();
  // Konfetti in Wellen nachschieben
  setTimeout(() => confettiBurst(30), 700);
  setTimeout(() => confettiBurst(40), 1600);
}
